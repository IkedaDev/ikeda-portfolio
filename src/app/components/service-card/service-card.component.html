<article class="service-card" inViewport classToAdd="animate-fade-in" >
    <picture class="service-card__img">
        <img [src]="data().image" [alt]="data().title">
    </picture>
    <h4 class="service-card__title" >{{data().title}}</h4>
    <p class="text service-card__description">
        {{data().description}}
    </p>
</article>
